<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Decay · Walrus Session 4</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <canvas id="particles" aria-hidden="true"></canvas>

    <div class="container">
      <header>
        <div class="logo">
          <span class="dotLogo"></span>
          Memory Decay
        </div>
        <div class="headerRight">
          <span id="memoryMode" class="chip">local demo</span>
          <span class="badge">Walrus S4</span>
        </div>
      </header>

      <section class="hero">
        <h1>Walrus never forgets.<br><span class="heroDim">But humans do.</span></h1>
        <p class="heroSub">Memories fade. This agent simulates that — then proves Walrus kept the original, pixel-perfect, forever.</p>
      </section>

      <section class="storeSection">
        <form id="saveForm" class="inlineForm">
          <div class="formFields">
            <input id="title" placeholder="Title" required />
            <textarea id="content" placeholder="What do you want to remember?" rows="1" required></textarea>
          </div>
          <button type="submit" class="btnPrimary">Store</button>
        </form>
        <div class="storeActions">
          <small id="saveState"></small>
          <div>
            <button id="seedDemo" class="btnGhost">Seed demo</button>
            <button id="clearLocal" class="btnGhost danger">Clear all</button>
          </div>
        </div>
      </section>

      <section class="timeline" id="timeline">
        <div class="timelineHeader">
          <h2>Memory timeline</h2>
          <div class="legend">
            <span><span class="dot fresh"></span> Clear</span>
            <span><span class="dot fading"></span> Fading</span>
            <span><span class="dot decayed"></span> Decayed</span>
          </div>
        </div>
        <div class="timelineBeam" aria-hidden="true">
          <div class="beamGlow"></div>
        </div>
        <div id="results"></div>
      </section>

      <footer>
        <span id="count">0 memories</span>
        <span>Decay: 7d half-life · Walrus stores originals</span>
      </footer>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
